name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vet (bench module)
        run: cd bench && go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # The generator zero-alloc tests skip under -race (crypto/rand allocates
      # there on Linux), so run once more without it to enforce the guarantee.
      - name: Test (zero-alloc guarantees, no race detector)
        run: go test -count=1 -run ZeroAlloc ./...

      - name: Verify 100% coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep ^total: | awk '{print $3}')
          echo "Coverage: $COVERAGE"
          if [ "$COVERAGE" != "100.0%" ]; then
            echo "FAIL: coverage is $COVERAGE, expected 100.0%"
            exit 1
          fi

      - name: Fuzz decoders
        run: go test -fuzz=FuzzDecodersAgree -fuzztime=30s ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Benchmarks (root)
        run: go test -bench=. -benchmem -count=1 -benchtime=1s ./...

      - name: Benchmarks (comparison)
        run: cd bench && go test -bench=. -benchmem -count=1 -benchtime=1s ./...
